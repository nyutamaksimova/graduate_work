name: cinema-loyalty
services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6385:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - loyalty-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: loyalty
      POSTGRES_USER: loyalty
      POSTGRES_PASSWORD: loyalty
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - loyalty-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyalty -d loyalty"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://loyalty:loyalty@postgres:5432/loyalty
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://loyalty:loyalty@postgres:5432/loyalty
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8005:8000"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
  cleanup:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://loyalty:loyalty@postgres:5432/loyalty
    command: ["sh", "-c", "while true; do python -m loyalty_service.cli cleanup; sleep 30; done"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  loyalty-data:
  loyalty-redis-data:
